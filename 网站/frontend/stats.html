<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>统计分析 · 教务管理系统</title>
    <link rel="stylesheet" href="css/style.css" />
    <style>
      .stats-grid {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 20px;
        margin-bottom: 20px;
      }
      @media (max-width: 768px) {
        .stats-grid {
          grid-template-columns: 1fr;
        }
      }

      .list-card {
        max-height: 400px;
        overflow-y: auto;
      }
      .list-item {
        display: flex;
        justify-content: space-between;
        padding: 10px 0;
        border-bottom: 1px solid #2a2a3c;
      }
      .list-item:last-child {
        border-bottom: none;
      }

      .fail-text {
        color: #ff4444;
        font-weight: bold;
      }
      .excellent-text {
        color: #00cc66;
        font-weight: bold;
      }
      .pass-rate-low {
        color: #ff4444;
      }
    </style>
  </head>
  <body>
    <header class="topbar">
      <a class="brand" href="scores.html">
        <span class="brand-mark"></span>
        成绩管理系统
      </a>
      <nav class="nav">
        <a href="scores.html">成绩列表</a>
        <a href="stats.html" class="active">统计分析</a>
        <a href="profile.html">我的</a>
      </nav>
      <div class="user-chip">
        <span class="user-name" id="navUser"></span>
        <button class="btn btn-ghost btn-sm" id="authBtn" type="button">
          退出
        </button>
      </div>
    </header>

    <main class="page">
      <div class="board-head">
        <div>
          <h1>成绩统计分析</h1>
          <p>按班级查看各科成绩概况，以及优秀与不合格学生名单</p>
        </div>
      </div>

      <!-- 1. 班级科目统计表 -->
      <section class="card" style="margin-bottom: 20px">
        <h2><span class="dot"></span>按班级统计各科成绩</h2>
        <div class="table-wrap">
          <table class="table">
            <thead>
              <tr>
                <th>班级</th>
                <th>科目</th>
                <th>参考人数</th>
                <th>平均分</th>
                <th>最高分</th>
                <th>最低分</th>
                <th>及格率</th>
              </tr>
            </thead>
            <tbody id="classStatsBody">
              <tr>
                <td colspan="7" style="text-align: center">加载中...</td>
              </tr>
            </tbody>
          </table>
        </div>
      </section>

      <!-- 2. 优秀与不合格名单 -->
      <div class="stats-grid">
        <!-- 不合格名单 -->
        <section class="card list-card">
          <h2>
            <span class="dot" style="background: #ff4444"></span
            >不合格学生名单（&lt;60分）
          </h2>
          <div id="failList">
            <p style="text-align: center; color: #888; padding: 20px">
              加载中...
            </p>
          </div>
        </section>

        <!-- 优秀名单 -->
        <section class="card list-card">
          <h2>
            <span class="dot" style="background: #00cc66"></span
            >优秀学生名单（&ge;90分）
          </h2>
          <div id="excellentList">
            <p style="text-align: center; color: #888; padding: 20px">
              加载中...
            </p>
          </div>
        </section>
      </div>
    </main>

    <script type="module" src="js/stats-page.js"></script>
  </body>
</html>
