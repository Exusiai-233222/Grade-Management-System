<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>成绩列表 · 教务管理系统</title>
    <link rel="stylesheet" href="css/style.css" />
    <style>
      .filter-bar {
        display: flex;
        gap: 15px;
        margin-bottom: 20px;
        background: #1e1e2d;
        padding: 15px;
        border-radius: 8px;
        align-items: center;
      }
      .filter-bar select,
      .filter-bar input {
        padding: 8px 12px;
        border-radius: 6px;
        border: 1px solid #333;
        background: #0f0f1a;
        color: white;
        outline: none;
      }
      .filter-bar button {
        padding: 8px 16px;
        background: #667eea;
        color: white;
        border: none;
        border-radius: 6px;
        cursor: pointer;
      }
      .table th {
        background: #1e1e2d;
        color: #aaa;
        font-weight: normal;
      }
      .table td {
        border-bottom: 1px solid #2a2a3c;
      }
      .score-bad {
        color: #ff4444;
        font-weight: bold;
      }
      .score-good {
        color: #00cc66;
        font-weight: bold;
      }
    </style>
  </head>
  <body>
    <header class="topbar">
      <a class="brand" href="scores.html">
        <span class="brand-mark"></span>
        成绩管理系统
      </a>
      <nav class="nav">
        <a href="scores.html" class="active">成绩列表</a>
        <a href="stats.html">统计分析</a>
        <a href="profile.html">我的</a>
      </nav>
      <div class="user-chip">
        <span class="user-name" id="navUser"></span>
        <button class="btn btn-ghost btn-sm" id="authBtn" type="button">
          退出
        </button>
      </div>
    </header>

    <main class="page">
      <div class="board-head">
        <div>
          <h1>学生成绩列表</h1>
          <p>查看和管理所有学生的各科成绩</p>
        </div>
      </div>

      <!-- 筛选栏 -->
      <div class="filter-bar">
        <label>科目筛选：</label>
        <select id="subjectFilter">
          <option value="">全部科目</option>
        </select>
        <button id="searchBtn">查询</button>

        <!-- 录入成绩按钮 -->
        <button id="addBtn" style="margin-left: auto; background: #00cc66">
          + 录入成绩
        </button>
      </div>

      <section class="card">
        <div class="table-wrap">
          <table class="table">
            <thead>
              <tr>
                <th>学号</th>
                <th>姓名</th>
                <th>班级</th>
                <th>科目</th>
                <th>分数</th>
                <th>状态</th>
                <th>操作</th>
              </tr>
            </thead>
            <tbody id="scoreTableBody">
              <!-- 数据由 JS 动态生成 -->
            </tbody>
          </table>
        </div>
      </section>
    </main>

    <!-- 录入成绩弹窗 -->
    <div
      id="scoreModal"
      style="
        display: none;
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background: rgba(0, 0, 0, 0.7);
        z-index: 1000;
        justify-content: center;
        align-items: center;
      "
    >
      <div
        class="card"
        style="width: 400px; max-height: 90vh; overflow-y: auto"
      >
        <h2><span class="dot"></span>录入成绩</h2>
        <div id="modalError" style="color: #ff4444; margin-bottom: 10px"></div>

        <div class="field">
          <label>学号</label>
          <input
            type="text"
            id="inStudentNo"
            class="input"
            placeholder="例如: 2023005"
          />
        </div>
        <div class="field">
          <label>姓名</label>
          <input type="text" id="inName" class="input" placeholder="学生姓名" />
        </div>
        <div class="field">
          <label>班级</label>
          <input
            type="text"
            id="inClass"
            class="input"
            placeholder="例如: 电子3班"
          />
        </div>
        <div class="field">
          <label>科目</label>
          <input
            type="text"
            id="inSubject"
            class="input"
            placeholder="例如: 大学物理"
          />
        </div>
        <div class="field">
          <label>分数</label>
          <input
            type="number"
            id="inScore"
            class="input"
            placeholder="例如: 95"
            step="0.1"
          />
        </div>

        <div style="display: flex; gap: 10px; margin-top: 20px">
          <button id="saveBtn" class="btn btn-primary" style="flex: 1">
            保存
          </button>
          <button id="cancelBtn" class="btn btn-ghost" style="flex: 1">
            取消
          </button>
        </div>
      </div>
    </div>

    <script type="module" src="js/scores-page.js"></script>
  </body>
</html>
